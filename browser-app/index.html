<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知数 · 本地数据分析</title><link rel="stylesheet" href="/src/style.css"><body><header><strong>知数 <small>LOCAL</small></strong><button id="clear">清除本页数据</button></header><main><section id="home"><p class="eyebrow">YOUR DATA. YOUR SPACE.</p><h1>让数据，回答你。</h1><p>无需注册。文件在你的浏览器里分析。</p><div class="glass"><label class="file">选择 CSV / Excel 文件<input id="file" type="file" accept=".csv,.xlsx"></label><button id="demo">使用示范数据</button><p id="dataset">尚未选择数据 · 最大 10 MB / 10 万行</p><details><summary>字段与类型</summary><div id="schema"></div></details><label for="question">你想了解什么？</label><textarea id="question" placeholder="例如：按 region 汇总 net_amount，按金额降序排列"></textarea><div id="options"><label><input type="checkbox" value="sql" checked> SQL 语句</label><label><input type="checkbox" value="table" checked> 数据表</label><label><input type="checkbox" value="chart" checked> 可视化</label><label><input type="checkbox" value="summary"> 结果摘要</label></div><button id="ask" class="primary">开始分析 ↗</button><details><summary>直接编写 SQL</summary><textarea id="sql" aria-label="SQL 编辑器">SELECT COUNT(*) AS total FROM data</textarea><button id="run">校验并运行 SQL</button></details></div><p class="privacy">使用 AI 时，仅发送问题和字段结构给 DeepSeek。文件内容和计算结果不上传。<br>本页关闭后数据清除；历史仅在本次打开期间保留。</p></section><p id="status" role="status" aria-live="polite"></p><section id="result" hidden><button id="back">← 返回提问</button><h2>分析结果</h2><div id="outputs"></div></section><details><summary>本次分析历史</summary><div id="history"></div></details></main><script type="module" src="/src/main.js"></script></body></html>
